<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Meathead</title>
<meta name="description" content="Meathead — adaptive dumbbell and kettlebell circuit trainer.">
<meta name="theme-color" content="#0e0f11"><meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meathead">
<meta name="format-detection" content="telephone=no">
<style>
:root{--bg:#0e0f11;--card:#1b1d20;--ink:#e8ecef;--mut:#9aa0a6;--acc:#CFE2F3;--acc2:#073763;--red:#990000;--warn:#e06666;--bd:#2d3034;--fig:#14171b}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--bg);border-top:3px solid #990000;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);z-index:5}
header b{font-size:18px}nav button{background:none;border:0;color:var(--mut);font-size:14px;padding:6px 8px}nav button.on{color:var(--acc);font-weight:600}
main{max-width:560px;margin:0 auto;padding:16px 16px 80px}
h2{font-size:20px;margin:8px 0 4px}h3{font-size:16px;margin:18px 0 8px}.mut{color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:14px}
.chip.hurt{background:#990000;border-color:#990000;color:#fff}.chip.sore{background:#352c12;border-color:#c9a23a;color:#e3c46a}.chip.work{background:#073763;border-color:#CFE2F3;color:#CFE2F3}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.btn{display:block;width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;margin-top:16px}
.btn.sec{background:var(--card);color:var(--acc);border:1px solid #073763}
.row{display:flex;gap:8px;align-items:center}.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{color:var(--ink);flex:1;border:0;background:var(--card);padding:10px;font-size:14px}.seg button.on{background:#073763;color:#CFE2F3}
.ex{display:flex;gap:12px;align-items:center}.ex svg{flex:0 0 96px;background:var(--fig);border-radius:10px;border:1px solid var(--bd)}
.big svg{width:100%;height:auto;max-height:240px;background:var(--fig);border-radius:12px;border:1px solid var(--bd)}
input,textarea{background:#15181b;color:var(--ink)}input[type=number]{width:84px;padding:10px;font-size:18px;border:1px solid var(--bd);border-radius:10px;text-align:center}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.rate button{color:var(--ink);padding:14px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:14px;font-weight:600}
.rate .e{color:var(--acc)}.rate .r{color:var(--ink)}.rate .h{color:var(--warn)}
.prog{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#073763,#990000)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--acc2);color:var(--acc);margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 0;border-bottom:1px solid var(--bd)}
.timer{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font:14px monospace}
.legend span{margin-right:10px;font-size:13px}
.desc{font-size:13px;color:#b8c7d6;margin:2px 0 4px}
ol.steps{margin:8px 0 0;padding-left:22px;font-size:14px;color:var(--mut)}ol.steps li{padding:3px 0;transition:color .2s}ol.steps li.on{color:#fff;font-weight:600}ol.steps li.on::marker{color:#ff6b6b}
.big svg{max-height:320px}
.timer.over{color:#ff6b6b}.rate button.sel{background:#073763;color:#CFE2F3;border-color:#CFE2F3}.rate button.on{background:#073763;color:#CFE2F3}.rate button.cont{background:#990000;color:#fff;border-color:#990000}

/* ---- mobile / PWA ---- */
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button{touch-action:manipulation;cursor:pointer;font-family:inherit}
header{padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}.brand b{letter-spacing:.06em;white-space:nowrap}
.logo{width:44px;height:auto;flex:0 0 44px}
nav{display:flex;flex:0 0 auto}nav button{min-height:44px;padding:8px 9px}
main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
textarea{font-size:16px}input[type=number]{min-height:44px}
.chip{min-height:40px}
#installBtn{margin-top:0}
@media (max-width:350px){.brand b{display:none}}
@media (display-mode:standalone){body{user-select:none;-webkit-user-select:none}input,textarea{user-select:text;-webkit-user-select:text}}

/* ---- v2: splash ---- */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .7s ease}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;transform:scale(.94);transition:opacity .9s ease,transform 1.3s cubic-bezier(.2,.7,.2,1)}
#splash.in .sp-in{opacity:1;transform:none}#splash.out{opacity:0;pointer-events:none}
#splash .splogo{width:min(62vw,280px);height:auto}#splash b{font-size:26px;letter-spacing:.22em;color:var(--ink);padding-left:.22em}
@media (prefers-reduced-motion:reduce){#splash .sp-in{transform:none}}
/* ---- v2: shared ---- */
.ic{width:22px;height:22px;flex:0 0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:14px;min-height:60px;padding:12px 14px;background:#0b1e33;border:1px solid #073763;border-radius:14px;color:var(--ink);text-align:left}
.bar b{display:block;font-size:16px;color:var(--acc)}.bar small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}.btn:disabled{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid #073763;background:#0b1e33;color:var(--acc);font-size:13px;font-weight:600;white-space:nowrap}.pill .ic{width:16px;height:16px}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--ink);padding:0}.ib:disabled{opacity:.3}
.tag.warn{background:#352c12;color:#e3c46a}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));z-index:40;background:#073763;color:#CFE2F3;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.5)}
/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(14,15,17,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.dk{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}.dk .btn{margin:0}
.tline{display:flex;align-items:center;justify-content:space-between;gap:12px}.tline .timer{font-size:38px;line-height:1;text-align:left}.tinfo{text-align:right;font-size:13px;line-height:1.35}
.ctl3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cb{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:12px;border:1px solid transparent;font-size:15px;font-weight:700}
.cb.back{background:#CFE2F3;color:#073763}.cb.pause{background:#3a3f44;color:#e8ecef;border-color:#555b61}.cb.start{background:#1e7b3c;color:#fff}
.cb.start.on{box-shadow:0 0 0 3px #7bd88f inset}.cb.pause.on{box-shadow:0 0 0 3px #a9adb3 inset}
.cb.cont{width:100%;min-height:62px;font-size:18px;background:rgba(153,0,0,.38);border:1.5px solid #c62828;color:#fff}.cb.cont .ic{width:26px;height:26px}
.cb:active,.btn:active{transform:scale(.98)}
/* ratings */
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.rrow>span{min-width:0}
.rmini{display:flex;gap:4px;flex:0 0 auto}.rmini button{min-width:56px;min-height:40px;border-radius:9px;border:1px solid var(--bd);background:#15181b;font-size:13px;font-weight:600;padding:0 6px}
.rmini .e{color:var(--acc)}.rmini .r{color:var(--ink)}.rmini .h{color:var(--warn)}.rmini button.sel{background:#073763;border-color:#CFE2F3;color:#CFE2F3}.rmini .h.sel{background:#990000;border-color:#ff6b6b;color:#fff}
.rate button.h.sel{background:#990000;border-color:#ff6b6b;color:#fff}
/* choose / explore */
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0}.opt>span{font-size:14px;color:var(--mut)}
.seg.sm button{padding:8px 11px;min-height:40px;min-width:40px}
.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-size:22px}.stepper b{min-width:72px;text-align:center}
.ctabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-top:10px}.ctabs button{flex:0 0 auto;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-weight:600}
.ctabs button.on{background:#073763;border-color:#CFE2F3;color:#CFE2F3}.ctabs small{opacity:.8;margin-left:4px}
.pk{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 4px}.pk.pon{border-color:#990000}
.ck{position:relative;width:44px;height:44px;display:grid;place-items:center;flex:0 0 44px}
.ck input{-webkit-appearance:none;appearance:none;width:30px;height:30px;margin:0;border:2px solid #5b6168;border-radius:8px;background:#15181b}
.ck input:checked{background:#990000;border-color:#ff6b6b}.ck input:focus-visible{outline:2px solid #CFE2F3;outline-offset:2px}
.ck .box{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-weight:800;font-size:12px;color:#fff}.ck .box .ic{width:18px;height:18px}
.pbody{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;color:inherit;padding:0;text-align:left}
.pbody svg{flex:0 0 84px;background:var(--fig);border-radius:10px;border:1px solid var(--bd)}.ptxt{display:flex;flex-direction:column;gap:2px;min-width:0}.ptxt .mut{font-size:12px}
.xtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.xfig svg{max-height:46vh}
.xstep{text-align:center;font-weight:600;color:#fff;min-height:24px;margin:8px 0 2px}
.xctl{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap}.ib.big1{width:56px;height:56px;background:#073763;border-color:#CFE2F3;color:#CFE2F3}
ol.steps.xs li button{background:none;border:0;color:inherit;font:inherit;text-align:left;padding:6px 0;width:100%;min-height:36px}
.prose p{margin:4px 0 10px;color:#cfd6dd}.prose ul{margin:6px 0 0;padding-left:20px;color:#cfd6dd}.prose li{padding:2px 0}
ul.setup{margin:8px 0 0;padding-left:18px;font-size:14px}ul.setup li{padding:2px 0}
/* full-workout sheet */
body.noscroll{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;justify-content:center}
.sh-in{background:var(--bg);width:100%;max-width:560px;height:100%;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.prow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;border-bottom:1px solid var(--bd)}.prow svg{flex:0 0 56px;background:var(--fig);border-radius:8px}
.prow.now{background:#0b1e33;outline:1px solid #073763}
.dots{display:flex;gap:5px;flex:0 0 auto}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid #5b6168;vertical-align:-1px}.dot.d{background:#CFE2F3;border-color:#CFE2F3}.dot.c{background:#990000;border-color:#ff6b6b}.dot.s{border-style:dashed}

/* ---- v3 ---- */
.hold{display:flex;flex-direction:column;gap:6px;margin:8px 0;padding:10px 12px;border-radius:12px;background:#0b1e33;border:1px solid #073763;font-size:14px;line-height:1.4}
.hold div{display:flex;gap:10px}.hold b{flex:0 0 46px;color:var(--acc);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}.hold span{color:#dfe8f1}
.mini{font-size:12.5px;color:#b8c7d6;margin:2px 0 4px;line-height:1.4}
.card.note{background:#352c12;border-color:#c9a23a;color:#e3c46a;font-size:14px}
.numf{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.numf small{font-size:12px}
.numf .stepper{gap:5px}.numf .stepper button{width:40px}.numf .stepper input{width:62px;min-height:44px;padding:8px;font-size:18px;border:1px solid var(--bd);border-radius:10px;text-align:center}
.locrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}.locrow .chips{gap:6px}.locrow .chip{min-height:36px;padding:6px 12px}
.lcard{display:flex;align-items:center;gap:10px}
.fld{display:flex;flex-direction:column;gap:6px;margin:10px 0;flex:1;min-width:0}.fld>span{font-size:14px;color:var(--mut)}
.fld input{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:#15181b;color:var(--ink)}
label.btn{display:flex;align-items:center;justify-content:center;text-align:center}
.uhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.uhead b{font-size:15px}
.useg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.useg button{min-width:52px;min-height:40px;border:0;background:var(--card);color:var(--ink);font-size:14px;font-weight:600}.useg button.on{background:#073763;color:#CFE2F3}
.nextc .prow{border-bottom:1px solid var(--bd)}.nextc .prow:last-of-type{border-bottom:0}.nl{font-size:14px;color:var(--acc);font-weight:600;margin-top:2px}
</style></head><body>

function uOf(eq,L){L=L||curLoc();return(L.u&&L.u[eq])||'lb'}
function conv(w,from,to){from=from||'lb';to=to||'lb';if(from===to)return w;return from==='kg'?w*2.20462:w/2.20462}
function stepList(eq){const L=curLoc(),r=(a,b,st)=>{const o=[];for(let w=a;w<=b+1e-9;w+=st)o.push(Math.round(w*100)/100);return o};let o=null;
 if(eq==='db')o=L.db;else if(eq==='kb')o=L.kb;else if(eq==='bb')o=r(L.bar,L.bbMax,uOf('bb',L)==='kg'?2.5:5);else if(eq==='cable')o=r(L.cMin,L.cMax,L.cStep||5);else if(eq==='ball')o=[L.ball];
 return o&&o.length?o:null}
function nearest(list,w){return list.reduce((p,c)=>Math.abs(c-w)<Math.abs(p-w)?c:p,list[0])}
function shift(eq,w,dir){const L=stepList(eq);if(!L)return w;const i=L.indexOf(nearest(L,w));return L[Math.max(0,Math.min(L.length-1,i+dir))]}
// reps: targets are always even; progression moves 2 at a time. Timed moves (carries) progress by weight, not time.
const evenUp=n=>Math.ceil(n/2)*2,up2=n=>n%2?n+1:n+2,dn2=n=>n%2?n-1:n-2;
function rng(e){if(e.unit==='s')return[e.reps[0],e.reps[1]];const hi=e.reps[1]%2?e.reps[1]-1:e.reps[1];return[Math.min(evenUp(e.reps[0]),hi),hi]}
function suggestStart(id){const e=byId[id],h=S.log[id],L=stepList(e.eq),u=uOf(e.eq),T=e.unit==='s',[lo,hi]=rng(e);
 if(!h){return{w:L?L[Math.min(1,L.length-1)]:0,reps:lo,u,note:'First time — pick a conservative weight and rate honestly.'}}
 let{w,reps,rate}=h.last;const lu=h.last.u||'lb';if(L)w=nearest(L,conv(w,lu,u));
 let note='Last time: '+(L?h.last.w+' '+lu+' × ':'')+reps+(T?' s':'')+' — '+rate;
 if(T){reps=Math.max(lo,Math.min(reps,hi));
  if(rate==='easy'&&L){w=shift(e.eq,w,1);note+=' → heavier, same time.'}else if(rate==='hard'&&L){w=shift(e.eq,w,-1);note+=' → lighter, same time.'}else note+=' → same weight and time.'}
 else if(rate==='easy'){if(L){w=shift(e.eq,w,1);reps=lo;note+=' → load up.'}else{reps=Math.min(up2(reps),hi+6);note+=' → +2 reps, slower tempo.'}}
 else if(rate==='right'){if(L&&reps>=hi){w=shift(e.eq,w,1);reps=lo;note+=' → top of range, load up.'}else{reps=Math.min(up2(reps),L?hi:hi+6);note+=' → +2 reps.'}}
 else{if(L){w=shift(e.eq,w,-1);reps=Math.min(Math.max(lo,evenUp(reps)),hi);note+=' → back off one step, own the form.'}else{reps=Math.max(lo,dn2(reps));note+=' → 2 fewer reps, strict.'}}

function nextSet(id,w,reps,rate){const e=byId[id],L=stepList(e.eq),u=uOf(e.eq),T=e.unit==='s',[lo,hi]=rng(e),top=L&&w>=L[L.length-1];
 if(T){if(rate==='easy'&&L&&!top)return{w:shift(e.eq,w,1),reps,u,note:'Easy → heavier, same time.'};if(rate==='hard'&&L)return{w:shift(e.eq,w,-1),reps,u,note:'Hard → lighter, same time.'};return{w,reps,u,note:rate==='easy'?'Easy → heaviest weight here; keep the time.':'Same weight, same time.'}}
 if(rate==='easy'){if(L&&!top)return{w:shift(e.eq,w,1),reps:lo,u,note:'Easy → up one weight.'};return{w,reps:up2(reps),u,note:'Easy → +2 reps, 3 s lowering.'}}
 if(rate==='right'){if(L&&!top&&reps>=hi)return{w:shift(e.eq,w,1),reps:lo,u,note:'Top of range → up one weight.'};return{w,reps:Math.min(up2(reps),L?hi:hi+6),u,note:'Right on → same weight, +2 reps.'}}
 if(L&&reps<=lo)return{w:shift(e.eq,w,-1),reps:lo,u,note:'Hard → drop one weight.'};

 app.querySelector('#plan').onclick=showPlan;wireRate(app,(k,r)=>rerate(C,k,r));
 timerInt=setInterval(()=>{const t=app.querySelector('#rt');if(!t)return clearInterval(timerInt);t.textContent=mmss((Date.now()-rs)/1000)},500);
 app.querySelector('#go').onclick=()=>{clearInterval(timerInt);if(!nx)return finish();C.sw={acc:0,run:Date.now()};save();vWork();window.scrollTo(0,0)}}
function finish(){const C=S.current;if(C&&C.sets.length){S.sessions.push({date:C.date,checkin:C.checkin,exercises:C.plan.flat(),sets:C.sets.map(({prev,...x})=>x)})}S.current=null;save();closeSheet();view='done';render();window.scrollTo(0,0)}
function vDone(){const s=S.sessions[S.sessions.length-1];if(!s)return nav('start');const vu=s.sets.some(x=>x.w)&&s.sets.filter(x=>x.w).every(x=>x.u==='kg')?'kg':'lb',vol=Math.round(s.sets.reduce((a,x)=>a+conv(x.w||0,x.u||'lb',vu)*x.reps,0));const ids=[...new Set(s.sets.map(x=>x.id))];
 app.innerHTML=`<h2>Workout logged</h2><div class="mut">${new Date(s.date).toLocaleString()}</div><div class="card">${s.sets.length} sets · ${vol.toLocaleString()} ${vu} total volume</div>
 <div class="card"><b>Rate each exercise</b><div class="mut">How did it feel overall? This sets your starting point next time.</div>
 ${ids.map(id=>{const k=s.sets.map(x=>x.id).lastIndexOf(id),x=s.sets[k];return`<div class="rrow"><span>${byId[id].n}<br><small class="mut">${x.w?x.w+' '+(x.u||'lb')+' · ':''}${x.reps}${x.rated?'':' · not rated'}</small></span>${rateBtns(k,x.rated?x.rate:null)}</div>`}).join('')}</div>
 <div class="card"><b>Cool-down (5 min)</b><br>Couch stretch, pigeon, doorway pec stretch, child's pose with side reach — 30–45 s each.</div><button class="btn" id="hist">See history</button>`;
 wireRate(app,(k,r)=>{const x=s.sets[k];x.rate=r;x.rated=true;if(S.log[x.id]&&S.log[x.id].last.date===s.date)S.log[x.id].last.rate=r;save()});
 app.querySelector('#hist').onclick=()=>nav('hist')}
function vHist(){const ss=[...S.sessions].reverse();
 app.innerHTML=`<h2>History</h2>${ss.length?'':'<div class="mut">No workouts yet.</div>'}
 <h3>Exercise progress</h3><div class="card"><table>${Object.entries(S.log).map(([id,h])=>`<tr><td>${byId[id]?.n||id}</td><td style="text-align:right">${h.last.w?h.last.w+' '+(h.last.u||'lb')+' × ':''}${h.last.reps} <span class="mut">(${h.last.rate})</span></td></tr>`).join('')||'<tr><td class="mut">—</td></tr>'}</table></div>
 <h3>Sessions</h3>${ss.map(s=>{const g={};s.sets.forEach(x=>(g[x.id]=g[x.id]||[]).push(x));
  return`<div class="card"><b>${new Date(s.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</b>
  ${s.checkin.hurt.length?`<div class="mut">Avoided: ${s.checkin.hurt.join(', ')}</div>`:''}${s.checkin.work.length?`<div class="mut">Focus: ${s.checkin.work.join(', ')}</div>`:''}
  <table>${Object.entries(g).map(([id,xs])=>`<tr><td>${byId[id]?.n||id}</td><td style="text-align:right">${xs.map(x=>(x.w?x.w+'×':'')+x.reps).join(', ')}</td></tr>`).join('')}</table></div>`}).join('')}`}
function vSet(){const st=S.settings;const le=S.lastExport?new Date(S.lastExport).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):null;
 app.innerHTML=`<h2>Settings</h2>
 <h3>Ideal workout length</h3><div class="seg" id="ideal">${[45,60,75,90].map(m=>`<button data-x="${m}" class="${st.ideal==m?'on':''}">${m} min</button>`).join('')}</div>
 <div class="mut" style="margin-top:6px">Today offers ${lenOpts().join(' · ')} min. 75 min and up adds a third circuit.</div>
 <h3>Locations</h3><div class="mut">Each location has its own equipment and weights. Workouts only use what's there.</div>
 ${S.locs.map(l=>`<div class="card lcard"><div style="flex:1;min-width:0"><b>${esc(l.name)}</b>${l.id===S.loc?' <span class="tag">Current</span>':''}<div class="mut">${l.eq.map(k=>EQL[k]).join(' · ')||'Bodyweight only'}</div></div><button class="pill" data-edit="${l.id}">Edit</button></div>`).join('')}
 <button class="btn sec" id="addloc">+ Add a location</button>
 <h3>Base rest between rounds (s)</h3><div class="row"><input type="number" id="rest" value="${st.rest}" inputmode="numeric"><button class="btn sec" id="sv" style="margin:0;width:auto;padding:0 20px">Save</button></div>
 <h3>Backup &amp; move to another device</h3>
 <div class="mut">Your data lives only on this device. Export saves a backup file you can keep in Files, iCloud or Drive, or open on another phone or computer and import.${le?` Last export: ${le}.`:''}</div>
 <button class="btn" id="exp">Export backup file</button>
 <label class="btn sec" for="impf" style="cursor:pointer">Import backup file</label><input type="file" id="impf" accept=".json,application/json" hidden>
 <button class="btn sec" id="rs" style="color:var(--warn);border-color:var(--warn)">Erase all data on this device</button>`;
 app.querySelectorAll('#ideal button').forEach(b=>b.onclick=()=>{st.ideal=+b.dataset.x;st.minutes=st.ideal;checkin.minutes=st.ideal;save();vSet()});
 app.querySelector('#sv').onclick=()=>{st.rest=+app.querySelector('#rest').value||60;save();toast('Saved')};
 app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{locEd=JSON.parse(JSON.stringify(S.locs.find(l=>l.id===b.dataset.edit)));nav('loc')});
 app.querySelector('#addloc').onclick=()=>{locEd=Object.assign(defLoc(),{id:'l'+Date.now().toString(36),name:'',eq:['db'],isNew:true});nav('loc')};
 app.querySelector('#exp').onclick=exportData;
 app.querySelector('#impf').onchange=ev=>{const fl=ev.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>importAsk(String(rd.result));rd.readAsText(fl);ev.target.value=''};
 app.querySelector('#rs').onclick=()=>{if(confirm('Erase all workouts, locations and settings on this device? Export a backup first if you want to keep them.')){try{localStorage.removeItem(KEY)}catch(e){}mem=null;S=migrate(load());render()}}}
// ---------- backup file: export / import (merge or replace) ----------
function exportData(){const name='meathead-backup-'+new Date().toISOString().slice(0,10)+'.json';S.lastExport=Date.now();save();
 const data=JSON.stringify(Object.assign({app:'meathead',exported:new Date().toISOString()},S));const file=new File([data],name,{type:'application/json'});
 const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
 if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Meathead backup'}).catch(()=>{})}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
 if(view==='set')vSet()}
function importAsk(txt){let D;try{D=JSON.parse(txt)}catch(e){D=null}
 if(!D||typeof D!=='object'||!D.settings||!Array.isArray(D.sessions))return toast('That file isn’t a Meathead backup');
 closeSheet();const el=document.createElement('div');el.className='sheet';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Import backup');
 el.innerHTML=`<div class="sh-in" style="height:auto;align-self:flex-end;border-radius:18px 18px 0 0"><h2>Import backup</h2>
 <div class="mut">This file has ${D.sessions.length} workout${D.sessions.length==1?'':'s'}${D.exported?`, exported ${new Date(D.exported).toLocaleDateString()}`:''}. This device has ${S.sessions.length}.</div>
 <button class="btn" id="imm">Merge with this device (recommended)</button><div class="mut" style="margin-top:6px">Keeps every workout from both, with no duplicates; keeps the most recent weights for each exercise; adds any new locations.</div>
 <button class="btn sec" id="imr">Replace everything on this device</button><button class="btn sec" id="imx">Cancel</button></div>`;
 document.body.appendChild(el);document.body.classList.add('noscroll');
 el.querySelector('#imx').onclick=closeSheet;el.querySelector('#imm').onclick=()=>importData(D,'merge');el.querySelector('#imr').onclick=()=>{if(confirm('Replace all data on this device with the backup?'))importData(D,'replace')}}
function importData(D,mode){D=migrate(JSON.parse(JSON.stringify(D)));delete D.app;delete D.exported;
 if(mode==='replace'){S=D}
 else{const have=new Set(S.sessions.map(x=>x.date));let added=0;D.sessions.forEach(x=>{if(!have.has(x.date)){S.sessions.push(x);added++}});S.sessions.sort((a,b)=>new Date(a.date)-new Date(b.date));
  Object.entries(D.log||{}).forEach(([id,h])=>{const m=S.log[id];if(!h||!h.last)return;if(!m||new Date(h.last.date)>new Date(m.last.date))S.log[id]={last:h.last,best:Math.max(h.best||0,(m&&m.best)||0)};else m.best=Math.max(m.best||0,h.best||0)});
  D.locs.forEach(l=>{if(!S.locs.some(x=>x.id===l.id))S.locs.push(l)});S._added=added}
 const n=mode==='replace'?S.sessions.length:S._added;delete S._added;save();closeSheet();
 toast(mode==='replace'?`Replaced: ${n} workouts loaded`:`Merged: ${n} new workout${n==1?'':'s'} added`);nav('set')}
// ---------- location editor ----------
let locEd=null;
function vLoc(){const L=locEd;if(!L)return nav('set');const has=k=>L.eq.includes(k);
 const U=k=>(L.u&&L.u[k])||'lb',useg=k=>`<span class="useg" role="group" aria-label="Units">${['lb','kg'].map(v=>`<button data-uk="${k}" data-uv="${v}" class="${U(k)===v?'on':''}" aria-pressed="${U(k)===v}">${v}</button>`).join('')}</span>`;
 const fld=(id,label,val,hint)=>`<label class="fld"><span>${label}</span><input id="${id}" value="${esc(val)}" inputmode="decimal">${hint?`<small class="mut">${hint}</small>`:''}</label>`;
 app.innerHTML=`<div class="xtop"><button class="pill" id="lback">${ICON.left}<span>Settings</span></button></div>
 <h2>${L.isNew?'New location':'Edit location'}</h2>
 <label class="fld"><span>Nickname</span><input id="lname" value="${esc(L.name)}" maxlength="24" placeholder="Home, Office gym, Hotel…" inputmode="text"></label>
 <h3>Equipment here</h3><div class="chips" id="leq">${Object.entries(EQL).map(([k,v])=>`<button class="chip ${has(k)?'work':''}" data-k="${k}" aria-pressed="${has(k)}">${v}</button>`).join('')}</div>
 <div class="mut" style="margin-top:6px">Bodyweight exercises are always available.</div>
 ${has('db')||has('kb')||has('barbell')||has('cable')||has('ball')?'<h3>Weights here</h3>':''}
 ${has('db')?`<div class="uhead"><b>Dumbbells</b>${useg('db')}</div>`+fld('ldb',`Per dumbbell, in ${U('db')}, comma separated`,L.db.join(', ')):''}
 ${has('kb')?`<div class="uhead"><b>Kettlebells</b>${useg('kb')}</div>`+fld('lkb',`In ${U('kb')}, comma separated`,L.kb.join(', ')):''}
 ${has('barbell')?`<div class="uhead"><b>Barbell + plates</b>${useg('bb')}</div><div class="row" style="gap:12px">${fld('lbar',`Bar (${U('bb')})`,L.bar)}${fld('lbbmax',`Heaviest load (${U('bb')})`,L.bbMax)}</div><div class="mut">${U('bb')==='kg'?'Loads go up 2.5 kg at a time (a 1.25 kg plate per side).':'Loads go up 5 lb at a time (a 2.5 lb plate per side).'}</div>`:''}
 ${has('cable')?`<div class="uhead"><b>Cable stack</b>${useg('cable')}</div><div class="row" style="gap:12px">${fld('lcmin',`Lightest (${U('cable')})`,L.cMin)}${fld('lcmax','Heaviest',L.cMax)}${fld('lcstep','Step',L.cStep)}</div>`:''}
 ${has('ball')?`<div class="uhead"><b>Slam ball</b>${useg('ball')}</div>`+fld('lball',`Weight (${U('ball')})`,L.ball):''}
 <button class="btn" id="lsave">Save location</button>
 ${!L.isNew&&S.locs.length>1?'<button class="btn sec" id="ldel" style="color:var(--warn);border-color:var(--warn)">Delete location</button>':''}`;
 const nums=v=>String(v).split(',').map(x=>parseFloat(x)).filter(x=>x>0).sort((a,b)=>a-b);
 const grab=()=>{const g=id=>{const x=app.querySelector('#'+id);return x?x.value:null};L.name=g('lname')??L.name;
  if(g('ldb')!==null)L.db=nums(g('ldb'));if(g('lkb')!==null)L.kb=nums(g('lkb'));
  if(g('lbar')!==null){L.bar=+g('lbar')||45;L.bbMax=Math.max(L.bar,+g('lbbmax')||315)}
  if(g('lcmin')!==null){L.cMin=+g('lcmin')||5;L.cStep=+g('lcstep')||5;L.cMax=Math.max(L.cMin,+g('lcmax')||150)}
  if(g('lball')!==null)L.ball=+g('lball')||15};
 app.querySelector('#lback').onclick=()=>nav('set');
 app.querySelectorAll('[data-uk]').forEach(b=>b.onclick=()=>{grab();const k=b.dataset.uk,v=b.dataset.uv,o=U(k);if(o===v)return;L.u=Object.assign({},L.u,{[k]:v});
  const A=UDEF[o],B=UDEF[v],same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);let swapped=true;
  if(k==='db'){if(same(L.db,A.db))L.db=B.db.slice();else swapped=false}
  else if(k==='kb'){if(same(L.kb,A.kb))L.kb=B.kb.slice();else swapped=false}
  else if(k==='bb'){if(L.bar===A.bar&&L.bbMax===A.bbMax){L.bar=B.bar;L.bbMax=B.bbMax}else swapped=false}
  else if(k==='cable'){if(L.cMin===A.cMin&&L.cMax===A.cMax&&L.cStep===A.cStep){L.cMin=B.cMin;L.cMax=B.cMax;L.cStep=B.cStep}else swapped=false}
  else if(k==='ball'){L.ball=Math.round(conv(L.ball,o,v)*2)/2}
  if(!swapped)toast(`Now in ${v} — check the numbers match what's printed on your weights`);const y=window.scrollY;vLoc();window.scrollTo(0,y)});
 app.querySelectorAll('#leq button').forEach(b=>b.onclick=()=>{grab();const k=b.dataset.k;L.eq=has(k)?L.eq.filter(x=>x!==k):[...L.eq,k];const y=window.scrollY;vLoc();window.scrollTo(0,y)});
 app.querySelector('#lsave').onclick=()=>{grab();L.name=L.name.trim();if(!L.name)return toast('Give the location a nickname');
  if(L.eq.includes('db')&&!L.db.length)return toast('List at least one dumbbell weight');if(L.eq.includes('kb')&&!L.kb.length)return toast('List at least one kettlebell weight');
  const isNew=L.isNew;delete L.isNew;const i=S.locs.findIndex(x=>x.id===L.id);if(i>=0)S.locs[i]=L;else S.locs.push(L);if(isNew)S.loc=L.id;save();locEd=null;toast(isNew?`${L.name} added and selected`:'Location saved');nav('set')};
 const d=app.querySelector('#ldel');if(d)d.onclick=()=>{if(!confirm(`Delete ${L.name}? Workout history is kept.`))return;S.locs=S.locs.filter(x=>x.id!==L.id);if(S.loc===L.id)S.loc=S.locs[0].id;save();locEd=null;nav('set')}}


// ---------- PWA: service worker, install, wake lock, persistent storage ----------
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let installEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view==='set')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;if(view==='set')render()});
let wake=null;async function wakeSync(){const want=view==='work'&&document.visibilityState==='visible';
 try{if(want&&!wake&&'wakeLock' in navigator){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}
 else if(!want&&wake){await wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',wakeSync);
const _render=render;render=function(){closeSheet();_render();dockPad();wakeSync();
 if(view==='set'&&installEvt){const b=document.createElement('button');b.className='btn';b.id='installBtn';b.textContent='Install Meathead app';
  b.onclick=async()=>{installEvt.prompt();await installEvt.userChoice;installEvt=null;render()};app.prepend(b)}};

// ---------- opening logo: fade in, hold 2 s, fade out (tap to skip) ----------
(function(){const sp=document.getElementById('splash');if(!sp)return;let gone=false;
 const out=()=>{if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>sp.remove(),750)};
 requestAnimationFrame(()=>requestAnimationFrame(()=>sp.classList.add('in')));
 setTimeout(out,900+2000);sp.addEventListener('click',out)})();
nav(S.current?'work':'start');
</script></body></html>
